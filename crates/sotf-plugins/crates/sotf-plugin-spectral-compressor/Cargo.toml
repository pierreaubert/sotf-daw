[package]
name = "sotf-plugin-spectral-compressor"
description = "SOTF Spectral Compressor plugin - per-bin frequency domain dynamics"
version = "0.5.25"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "sotf_plugin_spectral_compressor"
path = "src/lib.rs"

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sotf-restoration-mask = { path = "../sotf-restoration-mask", optional = true }

[features]
qa = ["sotf-host/qa", "dep:sotf-restoration-mask"]

[[bin]]
name = "qa-spectral-compressor"
path = "bin/qa_spectral_compressor.rs"
required-features = ["qa"]

[[bin]]
name = "qa-spectral-restoration-render"
path = "bin/qa_spectral_restoration_render.rs"
required-features = ["qa"]

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
