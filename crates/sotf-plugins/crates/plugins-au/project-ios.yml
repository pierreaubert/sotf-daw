name: SOTFAudioUnits-iOS
options:
  bundleIdPrefix: org.spinorama
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: 0.8.2
  CURRENT_PROJECT_VERSION: 1
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  SWIFT_VERSION: "6.0"

targetTemplates:
  SOTFiOSAudioUnitExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GenericAU
        name: GenericAU
        createIntermediateGroups: true
      - path: GenericAUiOS
        name: GenericAUiOS
        createIntermediateGroups: true
      - path: Shared
        name: Shared
        createIntermediateGroups: true
        headerVisibility: public
    settings:
      SWIFT_OBJC_BRIDGING_HEADER: Shared/BridgingHeader.h
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Automatic
      LIBRARY_SEARCH_PATHS:
        - $(PROJECT_DIR)/Resources
      HEADER_SEARCH_PATHS:
        - $(PROJECT_DIR)/Shared
      SKIP_INSTALL: false
      EXTENSION_SAFE_API_ONLY: true
      OTHER_LDFLAGS:
        - -lsotf_audio_plugins_ffi
        - -lsqlite3
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework

targets:
  SOTFAudioUnits-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App-iOS
        createIntermediateGroups: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.spinorama.SOTFAudioUnits.iOS
      INFOPLIST_FILE: App-iOS/Info.plist
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: EQiOSAudioUnit
        embed: true
      - target: AAEiOSAudioUnit
        embed: true
      - target: ABCompareiOSAudioUnit
        embed: true
      - target: AECiOSAudioUnit
        embed: true
      - target: AmbisonicsiOSAudioUnit
        embed: true
      - target: BandMergeiOSAudioUnit
        embed: true
      - target: BandSplitiOSAudioUnit
        embed: true
      - target: BeamformeriOSAudioUnit
        embed: true
      - target: BinauraliOSAudioUnit
        embed: true
      - target: ChannelMuteSoloiOSAudioUnit
        embed: true
      - target: CompressoriOSAudioUnit
        embed: true
      - target: ConvolutioniOSAudioUnit
        embed: true
      - target: CrossfeediOSAudioUnit
        embed: true
      - target: CrossoveriOSAudioUnit
        embed: true
