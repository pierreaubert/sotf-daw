[package]
name = "plugins-nih"
description = "VST3/CLAP plugin wrappers for SOTF audio plugins via nih-plug"
version = "0.6.0"
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Build one plugin per feature. The Justfile builds all sequentially.
eq = []
compressor = []
limiter = []
gate = []
gain = []
delay = []
expander = []
crossfeed = []
saturation = []
denoiser = []
speech-denoiser = []
hiss-reducer = []
declick = []
downmix = []
mono-to-stereo = []
stereo-imager = []
transient-shaper = []
de-esser = []
dynamic-eq = []
multiband-compressor = []
multiband-expander = []
convolution = ["dep:nih_plug_egui"]
fletcher-munson = []
loudness-compensation = []
channel-mute-solo = []
upmixer = []
aae = []
xtc = []
binaural = []
matrix = []
pnd = []
ab-compare = []
crossover = []
band-split = []
band-merge = []
aec = []
beamformer = []
linear-phase-eq = []
spectral-compressor = []
loudness-monitor = []
spectrum-analyzer = []
ambisonics = []
dither = []

[dependencies]
plugins-bridge = { path = "../plugins-bridge" }
sotf-host = { workspace = true }
sotf-plugins = { workspace = true }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { path = "../../../3rdparties/nih-plug-egui", optional = true }
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
crossbeam = { workspace = true }
parking_lot = { workspace = true }
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid", features = ["backtrace", "log"] }
