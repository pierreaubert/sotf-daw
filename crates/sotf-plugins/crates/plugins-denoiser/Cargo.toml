[package]
name = "plugins-denoiser"
description = "Shared denoiser DSP blocks for SOTF plugins"
version = "0.5.14"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "plugins_denoiser"
path = "src/lib.rs"

[features]
deep-filter = ["dep:deep-filter-runtime", "dep:ndarray017", "dep:plugins-inference", "dep:sha2"]

[dependencies]
nnnoiseless = { workspace = true }
math-dsp = { workspace = true }
serde = { workspace = true }
plugins-inference = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ndarray017 = { package = "ndarray", version = "0.17", optional = true }
deep-filter-runtime = { package = "sotf-deep-filter-runtime", path = "../../../../vendor/deep-filter-runtime", optional = true }
