[package]
name = "sotf-plugin-hiss-reducer"
description = "SOTF hiss reducer plugin - stationary high-frequency noise reduction"
version = "0.5.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_hiss_reducer"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]
interval-proposals = ["dep:rustfft", "dep:sha2", "dep:plugins-inference"]

[[bin]]
name = "qa-hiss-reducer"
path = "bin/qa_hiss_reducer.rs"
required-features = ["qa"]

[dependencies]
plugins-denoiser = { workspace = true }
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustfft = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
plugins-inference = { workspace = true, optional = true }

[dev-dependencies]
hound = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "qa-hiss-render"
path = "bin/qa_hiss_render.rs"
required-features = ["qa"]

[lints]
workspace = true
