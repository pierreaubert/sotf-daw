[package]
name = "sotf-plugin-denoiser"
description = "SOTF Denoiser plugin - audio denoising (MCRA/Wiener)"
version = "0.5.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_denoiser"
path = "src/lib.rs"

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
realfft = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sotf-plugin-pnd = { workspace = true }
sha2 = { workspace = true, optional = true }

[features]
qa = ["sotf-host/qa", "dep:sha2"]

[[bin]]
name = "qa-denoiser"
path = "bin/qa_denoiser.rs"
required-features = ["qa"]

[[bin]]
name = "qa-music-mask-render"
path = "bin/qa_music_mask_render.rs"
required-features = ["qa"]

[dev-dependencies]
hound = { workspace = true }

[lints]
workspace = true
