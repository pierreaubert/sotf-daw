[package]
name = "sotf-plugin-pnd"
description = "SOTF duration-preserving pitch-drift correction plugin"
version = "0.5.12"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_pnd"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]
neural-pitch = ["dep:tract-onnx", "dep:plugins-inference", "dep:sha2"]
# QA-only alternative: explicit dynamic-library binding, never downloaded at build time.
neural-pitch-ort = ["neural-pitch", "qa", "dep:ort"]
# Avoid linking both large standalone benchmark tools for every integration test.
qa-neural-tools = ["qa", "neural-pitch"]

[[bin]]
name = "qa-pnd"
path = "bin/qa_pnd.rs"
required-features = ["qa"]

[[bin]]
name = "qa-pnd-neural-compare"
path = "bin/qa_pnd_neural_compare.rs"
required-features = ["qa-neural-tools"]

[[bin]]
name = "qa-crepe-runtime"
path = "bin/qa_crepe_runtime.rs"
required-features = ["qa-neural-tools"]

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustfft = { workspace = true }
tract-onnx = { workspace = true, optional = true }
plugins-inference = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-23", "coreml"], optional = true }

[dev-dependencies]
hound = { workspace = true }
