[package]
name = "sotf-plugin-transient-shaper"
description = "SOTF Transient Shaper plugin - SPL Transient Designer approach"
version = "0.5.9"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "sotf_plugin_transient_shaper"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa", "dep:sha2"]

[[bin]]
name = "qa-transient-shaper"
path = "bin/qa_transient_shaper.rs"
required-features = ["qa"]

[[bin]]
name = "qa-onset-assist-render"
path = "bin/qa_onset_assist_render.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
