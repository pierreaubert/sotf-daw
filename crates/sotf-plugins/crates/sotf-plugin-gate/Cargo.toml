[package]
name = "sotf-plugin-gate"
description = "SOTF Gate plugin - noise gate"
version = "0.5.12"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_gate"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]
neural-speech = ["dep:plugins-denoiser", "dep:plugins-inference"]
silero-vad-eval = ["dep:tract-onnx", "dep:sha2"]
silero-speech = ["neural-speech", "dep:tract-onnx", "dep:sha2"]

[[bin]]
name = "qa-gate-silero"
path = "bin/qa_gate_silero.rs"
required-features = ["qa", "silero-vad-eval"]

[[bin]]
name = "qa-gate-speech"
path = "bin/qa_gate_speech.rs"
required-features = ["qa", "silero-speech"]

[[bin]]
name = "qa-gate"
path = "bin/qa_gate.rs"
required-features = ["qa"]

[dependencies]
plugins-denoiser = { workspace = true, optional = true }
plugins-inference = { workspace = true, optional = true }
tract-onnx = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sotf-host = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[[bin]]
name = "qa-speech-observe"
path = "bin/qa_speech_observe.rs"
required-features = ["qa", "silero-speech"]

[lints]
workspace = true
