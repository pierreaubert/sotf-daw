[package]
name = "sotf-plugin-eq"
description = "SOTF EQ plugin - parametric equalizer with biquad filters"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_eq"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]
gpui-ui = ["dep:plugins-gpui", "dep:gpui", "dep:gpui-audio-kit", "dep:gpui-px", "dep:gpui-ui-kit", "dep:sotf-midi"]

[[bin]]
name = "qa-eq"
path = "bin/qa_eq.rs"
required-features = ["qa"]

[[bench]]
name = "aud145_legacy_timing"
path = "benches/aud145_legacy_timing.rs"
harness = false

[dependencies]
sotf-host = { workspace = true }
math-iir-fir = { workspace = true }
serde = { workspace = true }

# GPUI UI (optional, behind gpui-ui feature)
plugins-gpui = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui-px = { workspace = true, features = ["gpui"], optional = true }
gpui-audio-kit = { workspace = true, optional = true }
gpui-ui-kit = { workspace = true, optional = true }
sotf-midi = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
