[package]
name = "plugins-spatial"
description = "Shared spatial DSP blocks for SOTF plugins"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "plugins_spatial"
path = "src/lib.rs"

[features]
