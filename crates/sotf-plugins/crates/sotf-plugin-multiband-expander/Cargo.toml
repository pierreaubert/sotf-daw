[package]
name = "sotf-plugin-multiband-expander"
description = "SOTF Multiband Expander plugin - multiband dynamic range expansion"
version = "0.5.26"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_multiband_expander"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa", "dep:sha2"]

[[bin]]
name = "qa-multiband-expander"
path = "bin/qa_multiband_expander.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustfft = { workspace = true }
sha2 = { workspace = true, optional = true }
