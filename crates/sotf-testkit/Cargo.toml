[package]
name = "sotf-testkit"
description = "Shared test fixtures and helpers for the SOTF DAW workspace"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
engine = ["dep:sotf-engine", "dep:cpal"]
plugin = ["dep:sotf-host"]

[dependencies]
hound = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }

sotf-engine = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
sotf-host = { workspace = true, optional = true }
