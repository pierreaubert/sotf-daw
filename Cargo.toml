[profile.dev]
opt-level = 1
split-debuginfo= "packed"
debug = 1
codegen-units = 256

[profile.release]
# `release` is the everyday optimised profile — used by CI, `just prod-*`,
# benchmarks, and local release iteration. Thin LTO keeps cross-crate inlining
# without the serial bottleneck of fat LTO, and 14 codegen units balance
# parallelism with optimiser visibility. Compile time stays in the few-minute
# range on typical hardware.
lto = "thin"
codegen-units = 14
panic = "unwind"  # Changed from "abort" to allow tests to run
# debug = true # Keeps debug symbols for profiling

# `dist` is the "cut a release" profile. Inherits everything from `release`
# (including panic=unwind) and tightens for maximum runtime performance at the
# cost of much longer compile time. Use via `cargo build --profile dist` —
# artifacts land in `target/dist/` instead of `target/release/`. The Justfile
# `dist-*` recipes wrap this for the shipping binaries.
#
# Tradeoffs vs `release`:
#   - lto = "fat"           — whole-program LTO across all crates. Serial,
#                             single-threaded final link; typically 5-10x
#                             slower than thin LTO. Worth it for the binary
#                             that ships to users.
#   - codegen-units = 1     — single codegen unit per crate maximises the
#                             optimiser's view, enables aggressive inlining
#                             and dead-code elimination.
#   - incremental = false   — incremental cache is useless for a release cut
#                             and can suppress some optimisations.
#   - strip is intentionally NOT set; macOS distribution scripts run
#     `dsymutil` before stripping so they can ship .dSYM bundles for crash
#     symbolication. Linux scripts strip with `strip -v` post-build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Explicit size-optimised profile for measuring and shipping small desktop
# binaries. It preserves unwind semantics for plugin/host panic boundaries,
# but strips the final executable and lets LLVM optimise for size.
[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"

# Vendored forks (same sources as sotf; paths relative to sotf-daw root).
[patch.crates-io]
nnnoiseless = { path = "../sotf/crates/3rdparties/nnnoiseless" }
coreaudio-rs = { path = "../sotf/crates/3rdparties/coreaudio-rs" }

# Keep Vello's crates.io wgpu dependency on the same Zed fork used by GPUI.
# Dependency patches are root-workspace configuration and are not inherited
# from the gpui-toolkit git dependency.
wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-core = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-hal = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
