anyhow = "1"
rust-ini = "0.18"
flate2 = "1"
tar = "0.4"
tract-core = { git = "https://github.com/sonos/tract", rev = "ed00ff7eadc84b345318b042f134602ed743879d" }
tract-onnx = { git = "https://github.com/sonos/tract", rev = "ed00ff7eadc84b345318b042f134602ed743879d" }
tract-pulse = { git = "https://github.com/sonos/tract", rev = "ed00ff7eadc84b345318b042f134602ed743879d" }
tract-hir = { git = "https://github.com/sonos/tract", rev = "ed00ff7eadc84b345318b042f134602ed743879d" }
