[package]
name = "sotf-deep-filter-runtime"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "df"

[features]
timings = []

[dependencies]
realfft = "3"
num-complex = { version = "0.4", features = ["serde", "bytemuck"] }
